  scholar:
    enabled: true
    bonus-percent:
      level-1: 10.0
      level-2: 20.0
      level-3: 35.0
  lucky:
    enabled: true
    chance-percent:
      level-1: 0.5
      level-2: 1.0
    points:
      minimum: 1
      maximum: 5
    daily-limit: 250
  clan_bond:
    enabled: true
    radius: 16.0
