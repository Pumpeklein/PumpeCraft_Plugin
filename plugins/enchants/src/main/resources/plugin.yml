name: PumpeEnchants
version: ${version}
main: de.pumpecraft.enchants.PumpeEnchantsPlugin
api-version: '1.21'
author: PumpeCraft
description: PDC-based custom enchantments for PumpeCraft.
depend: [PumpeUtils]
commands:
  customenchant:
    aliases: [cenchant, verzaubern]
    description: Applies a custom enchantment to the held item.
    usage: /customenchant <Spieler> <Verzauberung> <Stufe>
    permission: pumpecraft.enchants.admin
  enchantbooks:
    aliases: [testenchants]
    description: Hands out one book of every custom enchantment level.
    usage: /enchantbooks [Spieler]
    permission: pumpecraft.enchants.admin
permissions:
  pumpecraft.enchants.admin:
    description: Allows applying custom enchantments and handing out enchantment books.
    default: op
