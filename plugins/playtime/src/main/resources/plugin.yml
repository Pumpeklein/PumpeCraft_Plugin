name: PumpePlaytime
version: ${version}
main: de.pumpecraft.playtime.PumpePlaytimePlugin
api-version: '1.21'
author: PumpeCraft
description: Playtime plugin for PumpeCraft.
depend: [PumpeDatabase]
commands:
  playtime:
    description: Shows your tracked playtime.
    usage: /playtime [Spieler]
    permission: pumpecraft.playtime.use
permissions:
  pumpecraft.playtime.use:
    description: Allows viewing your own playtime.
    default: true
