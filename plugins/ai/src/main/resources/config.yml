config-version: 5

# Ohne Schluessel bleibt der Dienst aus und jedes Plugin nutzt seine eigenen Texte weiter.
# Der Schluessel kann auch in der Umgebungsvariable DEEPSEEK_API_KEY stehen; sie wird nur
# gelesen, wenn hier nichts eingetragen ist.
enabled: true
api-key: ""

base-url: "https://api.deepseek.com"
model: "deepseek-chat"

# Der Ton für alle erzeugten Texte. Gilt für jedes Plugin, das den Dienst nutzt; die
# jeweilige Aufgabe ("schreibe Todesmeldungen für Sturz") kommt aus dem Plugin dazu.
system-prompt: >-
  Du bist der Stimmungsmacher des deutschen Minecraft-Servers PumpeCraft und schreibst kurze
  Servermeldungen. Ton: frech, provokant und witzig, mit einem Augenzwinkern - aber niemals
  beleidigend. Verboten sind Beschimpfungen, Vulgärsprache und alles zu Aussehen, Herkunft,
  Familie, Religion, Politik oder echten Personen. Du ziehst die Situation auf, nie den Menschen
  dahinter. Regeln: eine Meldung pro Zeile, höchstens 100 Zeichen, ein Satz (maximal zwei kurze),
  keine Emojis, keine Anführungszeichen, keine Nummerierung, keine Farbcodes, kein Markdown.
  Platzhalter in geschweiften Klammern wie {player} übernimmst du wörtlich und übersetzt sie nie.

# Hoehere Temperatur = mehr Varianz in den Formulierungen.
temperature: 1.3
max-tokens: 900
request-timeout-seconds: 20

# Nach einem Fehlschlag wird fuer diese Zeit kein neuer Versuch gestartet, damit ein
# abgelaufener Schluessel oder eine Netzstoerung nicht bei jeder Meldung erneut auflaeuft.
failure-cooldown-seconds: 180

# Erzeugte Servermeldungen. Jedes Thema hat eigene Vorlagen im jeweiligen Plugin; was hier
# abgeschaltet wird, faellt darauf zurueck und kostet nichts.
messages:
  enabled: true

  # Zeilen pro Anfrage und die Grenze, ab der nachgefuellt wird. Groessere Stapel kosten pro
  # Zeile weniger, weil System-Prompt und Aufgabe nur einmal bezahlt werden.
  batch-size: 10
  refill-below: 3

  # Beim Start werden alle angemeldeten Themen einmal vorgefuellt - rund 44 Anfragen. Der Vorrat
  # ueberlebt einen Neustart in pools.yml, gebraucht wird das also nur beim allerersten Start
  # und nach neuen Themen.
  warm-up: true

  # Liefert eine Anfrage keine brauchbare Zeile, pausiert das Thema fuer diese Zeit. Sonst kostet
  # ein Thema, dessen Zeilen immer durchfallen, bei jeder Meldung eine weitere Anfrage.
  retry-cooldown-seconds: 300

  # Themen ohne erzeugte Texte. Ein * am Ende ist ein Praefix: "death-*" nimmt alle 33
  # Todesursachen auf einmal aus. Die Schluessel zeigt /pumpeai status.
  excluded-topics: []

# Moderation: prueft Texte ueber den kostenlosen Endpunkt von OpenAI. Er braucht einen eigenen
# Schluessel - der DeepSeek-Schluessel oben passt dort nicht. Bleibt "api-key" leer, wird
# OPENAI_API_KEY aus der Umgebung gelesen; fehlt auch der, prueft niemand und die Plugins
# bleiben bei ihren eigenen Filtern.
moderation:
  enabled: true
  api-key: ""

  base-url: "https://api.openai.com/v1"
  model: "omni-moderation-latest"

  request-timeout-seconds: 5
  failure-cooldown-seconds: 120

  # Laengere Texte werden vor dem Versand gekuerzt; eine Chatzeile bleibt weit darunter.
  max-characters: 500

  # Ab diesem Wert gilt eine Kategorie als Treffer und die Nachricht wird markiert. OpenAI selbst flaggt erst, wenn es sich sehr
  # sicher ist, und bewertet kurze deutsche Saetze auffallend niedrig: "Bring dich um" kommt auf
  # 0.12 self-harm/intent und 0.02 harassment. Darum liegen die Schwellen hier weit darunter -
  # harmlose Nachrichten liegen in diesen Kategorien typisch bei 0.0001, der Abstand reicht.
  # Niedriger = mehr Treffer, aber auch mehr Fehlalarme. /pumpeai check zeigt die Werte einer
  # echten Nachricht, danach laesst sich das nachziehen.
  default-threshold: 0.3
  thresholds:
    harassment: 0.1
    harassment/threatening: 0.05
    hate: 0.05
    hate/threatening: 0.05
    sexual: 0.2
    sexual/minors: 0.05
    self-harm: 0.1
    self-harm/intent: 0.1
    self-harm/instructions: 0.1
    illicit: 0.5
    illicit/violent: 0.4

  # Ab diesen Werten wiegt ein Treffer schwer genug, um die Nachricht anzuhalten, bis das Team
  # entschieden hat. Darunter wird nur markiert und sofort zugestellt. Wer hier ueberall dieselben
  # Werte wie oben eintraegt, haelt jede erkannte Nachricht an.
  default-hold-threshold: 0.7
  hold-thresholds:
    harassment: 0.5
    harassment/threatening: 0.3
    hate: 0.3
    hate/threatening: 0.2
    sexual: 0.6
    sexual/minors: 0.2
    self-harm: 0.4
    self-harm/intent: 0.4
    self-harm/instructions: 0.4
    illicit: 0.8
    illicit/violent: 0.7

  # Kategorien, die hier stehen, zaehlen nie als Treffer - auch dann nicht, wenn OpenAI selbst
  # flaggt. Gewalt steht drin, weil "ich hau dich gleich um" im Spiel meistens ein Creeper ist.
  ignored-categories:
    - violence
    - violence/graphic
