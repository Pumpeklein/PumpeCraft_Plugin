name: PumpeAI
version: ${version}
main: de.pumpecraft.ai.PumpeAiPlugin
api-version: '1.21'
author: PumpeCraft
description: Text generation and moderation service for PumpeCraft plugins.
depend: [PumpeUtils]
load: STARTUP
commands:
  pumpeai:
    description: Shows the AI state, lists the message topics, generates a test line or moderates a text.
    usage: /pumpeai <status|topics|test|check <Text>>
    permission: pumpecraft.ai.admin
permissions:
  pumpecraft.ai.admin:
    description: Allows checking and testing the AI connection.
    default: op
