name: PumpeEssentials
version: ${version}
main: de.pumpecraft.essentials.PumpeEssentialsPlugin
api-version: "1.21"
author: PumpeCraft
description: Essentials plugin for PumpeCraft.
depend: [PumpeDatabase, PumpeUtils, PumpeTransactions]
commands:
  openinv:
    description: Opens and edits the inventory of an online or offline player.
    usage: "/openinv <Spieler> | Konsole: /openinv <Viewer> <Spieler>"
    permission: pumpecraft.essentials.openinv
  opendender:
    description: Opens and edits the ender chest of an online or offline player.
    usage: "/opendender <Spieler> | Konsole: /opendender <Viewer> <Spieler>"
    aliases:
      - openender
      - openec
    permission: pumpecraft.essentials.opendender
  rename:
    description: Renames the item held in the main hand for PumpePoints.
    usage: "/rename <Name> | Konsole: /rename <Spieler> <Name>"
    permission: pumpecraft.essentials.rename
  sign:
    description: Signs the item held in the main hand for PumpePoints.
    usage: "/sign [Nachricht] | Konsole: /sign <Spieler> [Nachricht]"
    permission: pumpecraft.essentials.sign
  seen:
    description: Shows when a known player was last online.
    usage: /seen <Spieler>
    permission: pumpecraft.essentials.seen
  bc:
    description: Sends a server message to the global chat.
    usage: /bc <Nachricht>
    aliases:
      - broadcast
    permission: pumpecraft.essentials.broadcast
  back:
    description: Returns to the location left before a teleport or death.
    usage: /back [history | select <Index> | user <Spieler> [history | <Index>]]
    permission: pumpecraft.essentials.back
  sit:
    description: Sits the player down on the spot.
    usage: "/sit | Konsole: /sit <Spieler>"
    permission: pumpecraft.essentials.sit
  crawl:
    description: Puts the player into the crawling pose.
    usage: "/crawl | Konsole: /crawl <Spieler>"
    permission: pumpecraft.essentials.crawl
permissions:
  pumpecraft.essentials.*:
    description: Allows using all PumpeEssentials staff features.
    default: false
    children:
      pumpecraft.essentials.openinv: true
      pumpecraft.essentials.opendender: true
      pumpecraft.essentials.rename: true
      pumpecraft.essentials.sign: true
      pumpecraft.essentials.seen: true
      pumpecraft.essentials.broadcast: true
      pumpecraft.essentials.back: true
      pumpecraft.essentials.back.death: true
      pumpecraft.essentials.back.others: true
      pumpecraft.essentials.sit: true
      pumpecraft.essentials.crawl: true
  pumpecraft.essentials.openinv:
    description: Allows opening and editing player inventories.
    default: false
  pumpecraft.essentials.opendender:
    description: Allows opening player ender chests.
    default: false
  pumpecraft.essentials.rename:
    description: Allows renaming the held item for PumpePoints.
    default: true
  pumpecraft.essentials.sign:
    description: Allows signing the held item for PumpePoints.
    default: true
  pumpecraft.essentials.seen:
    description: Allows viewing when a known player was last online.
    default: false
  pumpecraft.essentials.broadcast:
    description: Allows sending server messages to the global chat.
    default: false
  pumpecraft.essentials.back:
    description: Allows returning to the location left before a teleport.
    default: false
  pumpecraft.essentials.back.death:
    description: Allows returning to own death locations.
    default: false
  pumpecraft.essentials.back.others:
    description: Allows viewing and using the back history of any player.
    default: false
  pumpecraft.essentials.sit:
    description: Allows sitting down on the spot.
    default: true
  pumpecraft.essentials.crawl:
    description: Allows crawling on the spot.
    default: true
