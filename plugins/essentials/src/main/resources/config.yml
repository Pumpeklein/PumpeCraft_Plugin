config-version: 8

item-services:
  rename:
    base-cost: 175
    per-character: 15
    value-percent: 15
  sign:
    base-cost: 100
    per-character: 8
    value-percent: 10

back:
  # Anzahl der gespeicherten Rücksprungpunkte je Spieler.
  history-size: 10
  # Teleports unter dieser Distanz innerhalb derselben Welt werden nicht gespeichert.
  minimum-distance: 8.0
  # Teleportgründe, die einen Punkt erzeugen. Werte aus PlayerTeleportEvent.TeleportCause.
  teleport-causes:
    - COMMAND
    - PLUGIN
    - SPECTATE
  teleport-command: "/tp %x% %y% %z%"

sit:
  # Lage des unsichtbaren Sitzes gegenüber der Standhöhe des Spielers. Bei 0.0 stehen die
  # Beine des Sitzenden genau auf der Fläche, auf der er vorher stand; kleinere Werte
  # versenken ihn darin, größere lassen ihn schweben.
  seat-offset: 0.0
  # Verhindert das Sitzen ohne festen Boden unter den Füßen.
  require-ground: true
