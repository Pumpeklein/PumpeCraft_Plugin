name: PumpeClanSystem
version: ${version}
main: de.pumpecraft.clans.PumpeClanSystemPlugin
api-version: '1.21'
author: PumpeCraft
description: Persistent clans, clan tab tags and player bases for PumpeCraft.
depend: [PumpeDatabase]
commands:
  clan:
    description: Manages clans, memberships and clan tags.
    usage: /clan <create|info|whois|request|requests|invite|accept|leave|kick|role|rename|color|delete>
  base:
    description: Manages and visits public or private player bases.
    usage: /base <set|visit|like|info|public|private|delete>
