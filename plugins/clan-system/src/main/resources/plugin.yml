name: PumpeClanSystem
version: ${version}
main: de.pumpecraft.clans.PumpeClanSystemPlugin
api-version: '1.21'
author: PumpeCraft
description: Persistent clans and clan tab tags for PumpeCraft.
depend: [PumpeDatabase]
commands:
  clan:
    description: Manages clans, memberships and clan tags.
    usage: "/clan <create|info|whois|request|requests|invite|accept|leave|kick|role|transfer|rename|color|delete|admin-delete> | Konsole: /clan as <Spieler> <Unterbefehl>"
