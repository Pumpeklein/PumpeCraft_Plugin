name: PumpeTrader
version: ${version}
main: de.pumpecraft.trader.PumpeTraderPlugin
api-version: '1.21'
author: PumpeCraft
description: Trader plugin for PumpeCraft.
commands:
  trader:
    description: Spawns a temporary PumpeCraft trader at your location.
    usage: /trader <Zeit>
    permission: pumpecraft.trader.spawn
permissions:
  pumpecraft.trader.*:
    description: Allows using all PumpeTrader staff features.
    default: false
    children:
      pumpecraft.trader.spawn: true
  pumpecraft.trader.spawn:
    description: Allows spawning temporary traders.
    default: false
