permissions:
  base-use:
    node: pumpecraft.base.use
    description: Allows opening the base menu and viewing player base information.
    default: true
  base-set:
    node: pumpecraft.base.set
    description: Allows setting, changing and deleting an own player base.
    default: true
  base-visit:
    node: pumpecraft.base.visit
    description: Allows visiting public player bases.
    default: true
  base-like:
    node: pumpecraft.base.like
    description: Allows liking public player bases.
    default: true
  base-admin:
    node: pumpecraft.base.admin
    description: Allows staff to inspect and visit private player bases.
    default: false
  plot-use:
    node: pumpecraft.plot.use
    description: Allows opening the plot menu and viewing plot information.
    default: true
  plot-claim:
    node: pumpecraft.plot.claim
    description: Allows buying and selling own plots.
    default: true
  plot-admin:
    node: pumpecraft.plot.admin
    description: Allows creating and removing admin regions and editing any plot.
    default: false
  plot-bypass:
    node: pumpecraft.plot.bypass
    description: Allows staff to build inside every plot regardless of its members and flags.
    default: false
