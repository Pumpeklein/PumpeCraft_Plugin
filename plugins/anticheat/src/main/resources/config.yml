checks:
  speed:
    enabled: true
    max-blocks-per-second-java: 8.2
    max-blocks-per-second-bedrock: 10.5
    cancel-level: 6.0
  fly:
    enabled: true
    max-air-ticks-java: 24
    max-air-ticks-bedrock: 34
    cancel-level: 7.0
  nofall:
    enabled: true
    minimum-fall-java: 4.0
    minimum-fall-bedrock: 6.0
    alert-level: 3.0
  fastplace:
    enabled: true
    max-places-per-second-java: 12
    max-places-per-second-bedrock: 16
    cancel-level: 5.0
  fastbreak:
    enabled: true
    max-breaks-per-second-java: 14
    max-breaks-per-second-bedrock: 18
    cancel-level: 5.0
  reach:
    enabled: true
    maximum-java: 3.35
    maximum-bedrock: 3.85
    cancel-level: 4.0
  autoclicker:
    enabled: true
    maximum-cps-java: 20
    maximum-cps-bedrock: 25
    minimum-samples: 12
    alert-level: 4.0
  scaffold:
    enabled: true
    suspicious-placements-java: 5
    suspicious-placements-bedrock: 8
    alert-level: 4.0
  xray:
    enabled: true
    window-seconds: 600
    minimum-natural-breaks-java: 40
    minimum-natural-breaks-bedrock: 50
    minimum-vein-discoveries-java: 5
    minimum-vein-discoveries-bedrock: 6
    maximum-vein-ratio-java: 0.12
    maximum-vein-ratio-bedrock: 0.16
    maximum-direct-blocks-java: 8
    maximum-direct-blocks-bedrock: 10
    suspicious-direct-paths-java: 3
    suspicious-direct-paths-bedrock: 4
    alert-level: 3.0

violations:
  alert-cooldown-millis: 1200
  decay-per-second: 0.08

bedrock:
  use-floodgate: true
  use-geyser: true
  disable-autoclicker-without-bedrock-api: false

client-detection:
  enabled: true
  announce-joins: true
  # Der Brand trifft erst nach dem Login ein. Die Join-Meldung wartet darauf,
  # statt nach fester Zeit "unbekannt" zu melden.
  brand-wait-ticks: 100
  announce-poll-ticks: 10
  scan-interval-ticks: 100
  server-resource-pack-status: true
  announce-mod-hints: true
  max-announced-mod-hints: 4
  # Der Mod-Loader wird ausschliesslich am Client-Brand erkannt. Plugin-Channels
  # taugen dafuer nicht: ein Fabric-Client mit Forge-Kompatibilitaetsmods
  # registriert fml:*-Channels und waere sonst zusaetzlich "Forge".
  loaders:
    Vanilla: ["vanilla"]
    Fabric: ["fabric"]
    Quilt: ["quilt"]
    NeoForge: ["neoforge"]
    Forge: ["forge", "fml"]
  # Eintraege werden exakt gegen Brand-Tokens bzw. Channel-Namespaces geprueft,
  # nicht als Teilstring. "labymod*" erlaubt Praefix-Treffer (labymod3, labymod4).
  # Hinweis: Cheat-Clients wie Wurst oder Meteor melden sich als "fabric" und
  # registrieren keine eigenen Channels - sie sind so nicht erkennbar.
  known-signatures:
    Lunar Client:
      brands: ["lunarclient"]
      channels: ["lunar", "lunarclient", "lunar-client"]
    Badlion Client:
      brands: ["badlion", "badlionclient"]
      channels: ["badlion"]
    Feather Client:
      brands: ["feather"]
      channels: ["feather"]
    LabyMod:
      brands: ["labymod"]
      channels: ["labymod*"]
    Salwyrr Client:
      brands: ["salwyrr"]
      channels: ["salwyrr"]
    PvPLounge:
      channels: ["pvplounge"]
    5zig:
      channels: ["5zig_set", "the5zigmod"]
    CheatBreaker:
      channels: ["cb-client"]
    Vivecraft (VR):
      brands: ["vivecraft"]
      channels: ["vivecraft"]
    Meteor Client:
      brands: ["meteor", "meteor-client"]
      channels: ["meteor-client"]
    Wurst Client:
      brands: ["wurst", "wurstclient"]
    LiquidBounce:
      brands: ["liquidbounce"]
    Impact Client:
      brands: ["impact"]
    Aristois:
      brands: ["aristois"]
      channels: ["aristois"]
    NoRiskClient:
      brands: ["noriskclient", "norisk"]
      channels: ["noriskclient"]
  # Rein informativ, loest keine Staff-Warnung aus. Launcher (Modrinth App, Prism,
  # CurseForge, MultiMC) senden nichts an den Server und sind hier nicht erfassbar -
  # sichtbar sind nur Mods, die selbst einen Plugin-Channel registrieren.
  # Startliste; mit "/anticheat client <Spieler>" die echten Channels ablesen
  # und hier ergaenzen.
  mod-hints:
    Xaero's Minimap:
      channels: ["xaerominimap", "xaeroworldmap"]
    JourneyMap:
      channels: ["journeymap"]
    VoxelMap:
      channels: ["voxelmap", "worldinfo"]
    Wynntils:
      channels: ["wynntils"]
    WorldEdit CUI:
      channels: ["worldedit:cui"]
    Carpet:
      channels: ["carpet"]
    Jade:
      channels: ["jade"]
    WTHIT:
      channels: ["wthit"]
    JEI:
      channels: ["jei"]
    REI:
      channels: ["roughlyenoughitems"]
    AppleSkin:
      channels: ["appleskin"]
    Better Sprinting:
      channels: ["bsm"]
    Distant Horizons:
      channels: ["distant_horizons", "distanthorizons"]
