config-version: 5

# Meldungen an das Team. Konsole und Datenbank bekommen immer jeden Treffer -
# hier wird nur gesteuert, was im Chat landet.
alerts:
  aggregate: true
  flush-interval-ticks: 100
  # Wiederholung derselben Kombination aus Spieler und Check erst nach dieser Zeit,
  # ausser die Violation-Stufe ist um escalation-step gestiegen.
  repeat-interval-seconds: 20
  escalation-step: 4.0
  max-lines-per-flush: 6
  log-to-console: true
  # Spielername und Koordinaten in jeder Meldung sind anklickbar. Der Klick schreibt den
  # Befehl nur in die Chatzeile, ausgefuehrt wird er vom Teammitglied selbst.
  # Platzhalter: %player% bzw. %x% %y% %z% %world%
  show-coordinates: true
  teleport-command: "/tp %player%"
  teleport-coordinates-command: "/tp %x% %y% %z%"

violations:
  decay-per-second: 0.08
  maximum-level: 40.0

# Nach einem Teleport oder einem Knockback ist die Bewegung fuer diese Zeit nicht
# bewertbar. Zum Testen per /tp niedriger setzen: sonst faellt ein kurzer Sturz
# komplett in die Schonzeit und wird nie gemessen.
movement:
  teleport-grace-millis: 2000
  velocity-grace-millis: 1500

bedrock:
  use-floodgate: true
  use-geyser: true
  disable-autoclicker-without-bedrock-api: false

checks:
  speed:
    enabled: true
    max-blocks-per-second-java: 8.2
    max-blocks-per-second-bedrock: 10.5
    alert-level: 4.0
    cancel-level: 6.0
  fly:
    enabled: true
    max-air-ticks-java: 24
    max-air-ticks-bedrock: 34
    alert-level: 3.0
    cancel-level: 7.0
  nofall:
    enabled: true
    minimum-fall-java: 4.0
    minimum-fall-bedrock: 6.0
    # Manche NoFall-Module lassen absichtlich einen Bruchteil Schaden durch, damit ein
    # reines "kam ueberhaupt Schaden?" nicht anschlaegt. Verglichen wird deshalb der
    # Basisschaden vor Ruestung und Verzauberung gegen die gemessene Fallhoehe.
    minimum-damage-ratio: 0.55
    safe-fall-distance: 3.0
    # Ein fehlender oder zu kleiner Fallschaden ist eindeutig, deshalb meldet schon der
    # erste bestaetigte Treffer. Wiederholungen bremst der alerts-Block, nicht dieser Wert.
    violation-amount: 2.0
    alert-level: 1.0
    # Schreibt die gemessene Fallhoehe und den erhaltenen Schaden in die Konsole,
    # auch wenn nichts gemeldet wird. Zum Einstellen von minimum-damage-ratio.
    debug: false
  reach:
    enabled: true
    maximum-java: 3.35
    maximum-bedrock: 3.85
    alert-level: 3.0
    cancel-level: 4.0
  autoclicker:
    enabled: true
    maximum-cps-java: 15
    maximum-cps-bedrock: 18
    minimum-samples: 10
    minimum-consistent-cps-java: 9.0
    minimum-consistent-cps-bedrock: 11.0
    maximum-interval-variation-java: 0.22
    maximum-interval-variation-bedrock: 0.30
    alert-level: 2.0
  killaura:
    enabled: true
    target-window-millis: 800
    maximum-targets: 3
    minimum-aim-dot-java: 0.55
    minimum-aim-dot-bedrock: 0.35
    # Ein Ziel direkt am Spieler steht fast senkrecht unter der Blickachse. Der Aim-Wert
    # ist dann auch bei einem sauberen Treffer niedrig, deshalb greift er erst ab hier.
    minimum-aim-distance: 2.0
    violation-amount: 2.0
    alert-level: 1.0
    debug: false
  fastplace:
    enabled: true
    max-places-per-second-java: 8
    max-places-per-second-bedrock: 11
    alert-level: 3.0
    cancel-level: 4.0
  fastbreak:
    enabled: true
    max-breaks-per-second-java: 14
    max-breaks-per-second-bedrock: 18
    boosted-maximum: 24
    alert-level: 3.0
    cancel-level: 5.0
  nuker:
    enabled: true
    window-millis: 400
    minimum-breaks-java: 4
    minimum-breaks-bedrock: 5
    # Streuung trennt Nuker von einem schnellen Miner, der auf derselben Stelle bleibt.
    minimum-spread: 2.5
    violation-amount: 3.0
    alert-level: 1.0
    debug: false
  blockreach:
    enabled: true
    maximum-java: 6.0
    maximum-bedrock: 7.0
    violation-amount: 2.0
    alert-level: 1.0
    cancel-level: 3.0
  scaffold:
    enabled: true
    suspicious-placements-java: 6
    suspicious-placements-bedrock: 10
    maximum-delay-millis-java: 260
    maximum-delay-millis-bedrock: 320
    minimum-aim-dot-java: 0.3
    minimum-aim-dot-bedrock: 0.1
    alert-level: 2.0
  xray:
    enabled: true
    window-seconds: 600
    minimum-natural-breaks-java: 40
    minimum-natural-breaks-bedrock: 50
    minimum-vein-discoveries-java: 5
    minimum-vein-discoveries-bedrock: 6
    maximum-vein-ratio-java: 0.12
    maximum-vein-ratio-bedrock: 0.16
    maximum-direct-blocks-java: 8
    maximum-direct-blocks-bedrock: 10
    suspicious-direct-paths-java: 3
    suspicious-direct-paths-bedrock: 4
    violation-amount: 2.0
    alert-level: 1.0
    debug: false
    # Xray ist ein statistischer Check: er wertet erst aus, wenn minimum-natural-breaks
    # und minimum-vein-discoveries im Zeitfenster erreicht sind. Ein kurzer Test schlaegt
    # daher nie an - mit debug: true den Zaehlerstand mitlesen.
    # valuable-blocks sind die gesuchten Erze, natural-blocks das erwartete Umfeld.
    valuable-blocks:
      - DIAMOND_ORE
      - DEEPSLATE_DIAMOND_ORE
      - EMERALD_ORE
      - DEEPSLATE_EMERALD_ORE
      - ANCIENT_DEBRIS
    natural-blocks:
      - STONE
      - DEEPSLATE
      - TUFF
      - GRANITE
      - DIORITE
      - ANDESITE
      - NETHERRACK
      - BASALT
      - BLACKSTONE

  # Prueft Items auf Werte, die im Survival nicht entstehen koennen.
  # action: alert (nur melden) | sanitize (Item reparieren) | remove (Item loeschen)
  # Nicht reparierbare Funde (verbotenes Material, Buch-Exploits, verschachtelte
  # Container) werden bei sanitize und remove immer geloescht.
  item:
    enabled: true
    action: alert
    alert-level: 1.0
    violation-per-finding: 1.5
    scan-interval-ticks: 1200
    allow-unbreakable: false
    allow-attribute-modifiers: false
    check-enchantment-target: true
    max-enchantment-overshoot: 0
    max-enchantments: 8
    max-potion-amplifier: 4
    max-potion-duration-seconds: 3600
    allow-infinite-potions: false
    max-display-name-length: 64
    max-lore-lines: 24
    max-lore-line-length: 128
    max-book-pages: 100
    max-book-characters: 25000
    scan-containers: true
    max-container-depth: 1
    forbidden-materials:
      - BEDROCK
      - BARRIER
      - LIGHT
      - STRUCTURE_BLOCK
      - STRUCTURE_VOID
      - JIGSAW
      - COMMAND_BLOCK
      - CHAIN_COMMAND_BLOCK
      - REPEATING_COMMAND_BLOCK
      - COMMAND_BLOCK_MINECART
      - DEBUG_STICK
      - END_PORTAL_FRAME
      - SPAWNER
      - BUDDING_AMETHYST
      - REINFORCED_DEEPSLATE

  # Faengt ab, was ein Exploit-Item hinterlaesst, nachdem es konsumiert wurde.
  # ignored-causes akzeptiert die Namen aus EntityPotionEffectEvent.Cause,
  # damit vom Team per Befehl vergebene Effekte nicht melden.
  effect:
    enabled: true
    alert-level: 1.0
    violation-amount: 2.0
    scan-interval-ticks: 200
    max-amplifier: 4
    max-duration-seconds: 3600
    allow-infinite: false
    remove-illegal: true
    ignored-causes:
      - PLUGIN
      - COMMAND
      - CONVERSION
      - BEACON
      - CONDUIT
      - TOTEM
      - WITHER_ROSE
      - DOLPHIN
      - VILLAGER_TRADE
      - PATROL_CAPTAIN
      - EXPIRATION
      - UNKNOWN

client-detection:
  enabled: true
  announce-joins: true
  brand-wait-ticks: 100
  announce-poll-ticks: 10
  scan-interval-ticks: 100
  server-resource-pack-status: true
  announce-mod-hints: true
  max-announced-mod-hints: 4
  # Ein echter Vanilla-Client registriert keinen einzigen Plugin-Channel. Wer den
  # Vanilla-Brand meldet und trotzdem Channels registriert, faelscht ihn - das bekommt
  # kein clientseitiger Spoofer weg. Bedrock-Spieler sind ausgenommen.
  # ignored-channels nur fuellen, wenn ein Proxy nachweislich Channels beisteuert.
  spoof-detection:
    enabled: true
    vanilla-brands: ["vanilla"]
    ignored-channels: []
  # Der Mod-Loader wird ausschliesslich am Client-Brand erkannt. Plugin-Channels
  # taugen dafuer nicht: ein Fabric-Client mit Forge-Kompatibilitaetsmods
  # registriert fml:*-Channels und waere sonst zusaetzlich "Forge".
  loaders:
    Vanilla: ["vanilla"]
    Fabric: ["fabric"]
    Quilt: ["quilt"]
    NeoForge: ["neoforge"]
    Forge: ["forge", "fml"]
  # Exakter Abgleich gegen Brand-Tokens bzw. Channel-Namespaces, kein Teilstring.
  # "labymod*" erlaubt Praefix-Treffer. Cheat-Clients wie Wurst oder Meteor melden
  # sich als "fabric" und registrieren keine eigenen Channels - so nicht erkennbar.
  known-signatures:
    Lunar Client:
      brands: ["lunarclient"]
      channels: ["lunar", "lunarclient", "lunar-client"]
    Badlion Client:
      brands: ["badlion", "badlionclient"]
      channels: ["badlion"]
    Feather Client:
      brands: ["feather"]
      channels: ["feather"]
    LabyMod:
      brands: ["labymod"]
      channels: ["labymod*"]
    Salwyrr Client:
      brands: ["salwyrr"]
      channels: ["salwyrr"]
    PvPLounge:
      channels: ["pvplounge"]
    5zig:
      channels: ["5zig_set", "the5zigmod"]
    CheatBreaker:
      channels: ["cb-client"]
    Vivecraft (VR):
      brands: ["vivecraft"]
      channels: ["vivecraft"]
    Meteor Client:
      brands: ["meteor", "meteor-client"]
      channels: ["meteor-client"]
    Wurst Client:
      brands: ["wurst", "wurstclient"]
    LiquidBounce:
      brands: ["liquidbounce"]
    Impact Client:
      brands: ["impact"]
    Aristois:
      brands: ["aristois"]
      channels: ["aristois"]
    NoRiskClient:
      brands: ["noriskclient", "norisk"]
      channels: ["noriskclient"]
  # Rein informativ, loest keine Staff-Warnung aus. Launcher (Modrinth App, Prism,
  # CurseForge, MultiMC) senden nichts an den Server und sind hier nicht erfassbar -
  # sichtbar sind nur Mods, die selbst einen Plugin-Channel registrieren.
  # Startliste; mit "/anticheat client <Spieler>" die echten Channels ablesen
  # und hier ergaenzen.
  mod-hints:
    Xaero's Minimap:
      channels: ["xaerominimap", "xaeroworldmap"]
    JourneyMap:
      channels: ["journeymap"]
    VoxelMap:
      channels: ["voxelmap", "worldinfo"]
    Wynntils:
      channels: ["wynntils"]
    WorldEdit CUI:
      channels: ["worldedit:cui"]
    Carpet:
      channels: ["carpet"]
    Jade:
      channels: ["jade"]
    WTHIT:
      channels: ["wthit"]
    JEI:
      channels: ["jei"]
    REI:
      channels: ["roughlyenoughitems"]
    AppleSkin:
      channels: ["appleskin"]
    Better Sprinting:
      channels: ["bsm"]
    Distant Horizons:
      channels: ["distant_horizons", "distanthorizons"]
