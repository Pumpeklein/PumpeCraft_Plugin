# Belohnungen fuer Skill-Level.
#
# Diese Datei ist die einzige Quelle. Die Tabelle pc_skill_reward_definitions ist nur ein
# Spiegel: sie wird bei jedem Serverstart geleert und aus dieser Config neu geschrieben,
# und vom Plugin nie gelesen. Aenderungen dort gehen beim naechsten Start verloren.
#
# milestones gilt fuer jeden Skill. Unter skills.<skill> lassen sich einzelne Stufen
# ersetzen oder zusaetzliche Stufen ergaenzen - der Skill bekommt dann beides.
#
# Items entweder kurz als "MATERIAL:Anzahl" oder ausfuehrlich mit material, amount,
# name und enchantments. Verzauberungen bleiben im Vanilla-Rahmen; hoehere Stufen werden
# abgelehnt, damit die Item-Pruefung des AntiCheats nicht anschlaegt.
# Mengen ueber der Stapelgroesse werden auf mehrere Stapel verteilt - "SADDLE:2" ergibt
# also zwei einzelne Saettel.
rewards:
  enabled: true

  # Dichte Abstaende im frueheren Verlauf, danach groessere Spruenge.
  milestones:
    "3":
      label: "8 Eisenbarren"
      items: ["IRON_INGOT:8"]
    "5":
      label: "16 Erfahrungsflaeschchen"
      items: ["EXPERIENCE_BOTTLE:16"]
    "10":
      label: "4 Diamanten"
      items: ["DIAMOND:4"]
    "15":
      label: "Buch: Haltbarkeit III"
      items:
        - material: ENCHANTED_BOOK
          enchantments:
            unbreaking: 3
    "20":
      label: "1 Diamantblock"
      items: ["DIAMOND_BLOCK:1"]
    "25":
      label: "Buch: Reparatur"
      items:
        - material: ENCHANTED_BOOK
          enchantments:
            mending: 1
    "30":
      label: "32 Erfahrungsflaeschchen"
      items: ["EXPERIENCE_BOTTLE:32"]
    "35":
      label: "2 Diamantbloecke"
      items: ["DIAMOND_BLOCK:2"]
    "40":
      label: "1 Netherit-Schrott"
      items: ["NETHERITE_SCRAP:1"]
    "45":
      label: "1 verzauberter goldener Apfel"
      items: ["ENCHANTED_GOLDEN_APPLE:1"]
    "50":
      label: "2 Netherit-Schrott und 4 Goldbarren"
      items: ["NETHERITE_SCRAP:2", "GOLD_INGOT:4"]
    "60":
      label: "1 Netheritbarren"
      items: ["NETHERITE_INGOT:1"]
    "70":
      label: "2 verzauberte goldene Aepfel"
      items: ["ENCHANTED_GOLDEN_APPLE:2"]
    "80":
      label: "2 Netheritbarren"
      items: ["NETHERITE_INGOT:2"]
    "90":
      label: "Shulkerkiste und 3 Netheritbarren"
      items: ["SHULKER_BOX:1", "NETHERITE_INGOT:3"]
    "100":
      label: "1 Netheritblock"
      items: ["NETHERITE_BLOCK:1"]

  # Ersetzt die Standardstufe fuer diesen Skill. Alle nicht genannten Level bleiben wie oben.
  skills:
    miner:
