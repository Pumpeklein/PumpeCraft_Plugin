name: PumpeSkills
version: ${version}
main: de.pumpecraft.skills.PumpeSkillsPlugin
api-version: '1.21'
author: PumpeCraft
description: Skill levels, rewards, progress GUIs and leaderboards for PumpeCraft.
depend: [PumpeDatabase, PumpeUtils]
softdepend: [PumpeEnchants]
commands:
  skills:
    description: Opens skill GUIs, leaderboards and manages skill scores.
    usage: /skills [Skill|Spieler|top <Skill>|set|add|setlevel|reset]
    permission: pumpecraft.skills.use
permissions:
  pumpecraft.skills.use:
    description: Allows viewing your own skills and the leaderboards.
    default: true
  pumpecraft.skills.others:
    description: Allows viewing the skills of other players.
    default: op
  pumpecraft.skills.admin:
    description: Allows setting skill scores and levels of other players.
    default: op
